<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة | فرق العمر</title>
  <meta name="description" content="الصفحة التي تبحث عنها غير موجودة. عد إلى دليل حساب فرق العمر بين شخصين.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1c2440">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=2">
  <style>
    .error-page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(circle at 18% 20%, rgba(217, 93, 80, 0.18), transparent 30%),
        radial-gradient(circle at 82% 80%, rgba(46, 125, 122, 0.2), transparent 30%),
        var(--paper);
    }

    .error-card {
      width: min(100%, 42rem);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--white);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .error-code {
      margin: 0;
      color: var(--coral-strong);
      font-family: var(--font-heading);
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 800;
      line-height: 1;
    }

    .error-card h1 {
      margin-top: 0.5rem;
    }

    .error-card p {
      color: var(--ink-soft);
    }

    .error-card .button {
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-card">
      <p class="section-kicker">خطأ 404</p>
      <p class="error-code">404</p>
      <h1>الصفحة غير موجودة</h1>
      <p>الرابط الذي فتحته قد يكون قديماً أو مكتوباً بشكل غير صحيح. يمكنك العودة إلى دليل حساب فرق العمر بين شخصين والمتابعة من هناك.</p>
      <a class="button button-primary" href="/">العودة إلى الصفحة الرئيسية</a>
    </div>
  </main>
</body>
</html>
